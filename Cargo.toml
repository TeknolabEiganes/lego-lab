[package]
name = "lego-lab"
version = "0.1.0"
edition = "2024"
description = "Native Rust visual programming app for LEGO Education Computer Science & AI kits"
license = "MIT"

[dependencies]
eframe = "0.36"
egui = "0.36"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
btleplug = "0.13"
futures = "0.3"
uuid = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Camera: webcam capture and the MoveNet body-pose model.
v4l = "0.14"
tract-onnx = "0.23"
# Sound on the computer (Beep / Play Tune "on this computer").
rodio = { version = "0.23", default-features = false, features = ["playback"] }

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
